<div class="bg-sky-100 flex justify-center items-center h-screen">
  <div class="w-1/2 h-screen hidden lg:block">
    <img src="../../../assets/login_and_signup.jpeg" alt="Placeholder Image"
      class="object-cover w-full h-full">
  </div>

  <div class="lg:p-36 md:p-52 sm:20 p-8 w-full lg:w-1/2">
    <h1 class="text-2xl font-semibold mb-4">SignUp</h1>
    <form (ngSubmit)="onSubmit(signupForm)" #signupForm="ngForm">
      <div *ngIf="errorMessage" class="text-red-600 font-bold text-center bg-red-200">
        <p class="p-2">{{ errorMessage }}</p>
      </div>

      <div class="mb-4">
        <label for="firstName" class="block text-gray-600">First Name</label>
        <input type="text" id="firstName" name="firstName" [(ngModel)]="firstName" required
          class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500">
        <div *ngIf="signupForm.submitted || signupForm.controls['firstName']?.touched"
             class="text-red-500 text-sm">
          <div *ngIf="signupForm.controls['firstName']?.errors?.['required']">
            First Name is required.
          </div>
        </div>
      </div>

      <div class="mb-4">
        <label for="lastName" class="block text-gray-600">Last Name</label>
        <input type="text" id="lastName" name="lastName" [(ngModel)]="lastName" required
          class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500">
        <div *ngIf="signupForm.submitted || signupForm.controls['lastName']?.touched"
             class="text-red-500 text-sm">
          <div *ngIf="signupForm.controls['lastName']?.errors?.['required']">
            Last Name is required.
          </div>
        </div>
      </div>

      <div class="mb-4">
        <label for="email" class="block text-gray-600">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required email
          class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500">
        <div *ngIf="signupForm.submitted || signupForm.controls['email']?.touched" 
             class="text-red-500 text-sm">
          <div *ngIf="signupForm.controls['email']?.errors?.['required']">
            Email is required.
          </div>
          <div *ngIf="signupForm.controls['email']?.errors?.['email']">
            Please enter a valid email address.
          </div>
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="block text-gray-800">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required minlength="6"
          class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500">
        <div *ngIf="signupForm.submitted || signupForm.controls['password']?.touched" 
             class="text-red-500 text-sm">
          <div *ngIf="signupForm.controls['password']?.errors?.['required']">
            Password is required.
          </div>
          <div *ngIf="signupForm.controls['password']?.errors?.['minlength']">
            Password must be at least 6 characters long.
          </div>
        </div>
      </div>

      <div class="mb-4 flex items-center">
        <input type="checkbox" id="remember" name="remember" [(ngModel)]="rememberMe" class="text-red-500">
        <label for="remember" class="text-green-900 ml-2">Remember Me</label>
      </div>

      <!-- <div class="mb-6 text-blue-500">
        <a href="/forgot-password" class="hover:underline">Forgot Password?</a>
      </div> -->

      <button type="submit"
        class="bg-red-500 hover:bg-blue-600 text-white font-semibold rounded-md py-2 px-4 w-full"
        >SignUp</button>
    </form>

    <div class="mt-6 text-green-500 text-center cursor-pointer">
      <a href="/login" class="hover:underline">Login Here</a>
    </div>
  </div>
</div>
