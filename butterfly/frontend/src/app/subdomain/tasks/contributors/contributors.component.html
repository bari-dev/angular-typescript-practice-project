<div
  *ngIf="showModal"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
>
  <div class="p-6 rounded-lg w-[30%] bg-[#212121] relative">
    <button (click)="closeDialog()" 
            class="absolute top-2 right-2 text-white px-4 py-2 rounded-md font-semibold">
      <mat-icon>close</mat-icon>
    </button>
  
    <div class="text-white bg-[#424242] my-3 p-2 rounded-lg mt-5 flex justify-between items-center flex-col w-100">
      <h2 class="m--b-0">Members</h2>
      <ul class="p-3">
        <li *ngFor="let member of tasklistMembers" class="flex justify-between items-center border-b border-gray-500 p-2 mb-2">
          {{ member.firstName + " " + member.lastName }} -> {{ member.email }}

          <button
            (click)="removeContributor(member)"
            class="text-red-500 ml-2"
            *ngIf="isCreator && member.id !== tasklistCreatorId"
          >
            Remove
        </button>
        </li>
      </ul>
    </div>
  </div>
</div>

<button
  (click)="openModal()"
  class="hover:bg-red-500 bg-blue-600 text-white font-semibold py-2 px-4 rounded-md mr-3"
>
Members
</button>
