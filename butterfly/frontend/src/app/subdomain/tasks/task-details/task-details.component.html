<div *ngIf="task" class="bg-[#424242] text-white shadow-lg p-4 transition-all duration-300 relative w-full">
    <h2 class="text-xl font-bold mb-4">Task Details</h2>
    <div>
        <p><strong>Title:</strong> {{ task.title }}</p>
        <p><strong>Status:</strong> {{ task.status }}</p>
        <p><strong>Description:</strong> {{ task.description || 'No description provided.' }}</p>
    </div>
    <button (click)="closePanel()" class="absolute top-4 right-4 text-lg text-white">&times;</button>
</div>
