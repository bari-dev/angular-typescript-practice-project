<div class="flex justify-center items-center min-h-screen bg-[#212121]">
  <div class="w-full max-w-sm p-8 bg-[#303030] rounded-lg shadow-lg">
    <h2 class="text-2xl font-semibold text-center text-white mb-6">Login</h2>

    <div *ngIf="errorMessage" class="text-red-600 font-bold text-center bg-red-200">
      <p class="p-2">{{ errorMessage }}</p>
    </div>

    <form (ngSubmit)="onSubmit(loginForm)" #loginForm="ngForm">
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-white">Email <span class="text-red-500 relative top-[-3px]">*</span></label>
        <input type="email" id="email" name="email" ngModel
          class="w-full border border-gray-300 rounded-md py-2 px-3"
          autocomplete="off" required>
      </div>
      <div class="mb-4">
        <label for="password" class="block text-sm font-medium text-white">Password <span class="text-red-500 relative top-[-3px]">*</span></label>
        <input type="password" id="password" name="password" ngModel
          class="w-full border border-gray-300 rounded-md py-2 px-3"
          autocomplete="off" required>
      </div>
      <button type="submit"
        class="hover:bg-red-500 bg-blue-600 text-white font-semibold rounded-md py-2 px-4 w-full">
        Login
      </button>
    </form>
  </div>
</div>
