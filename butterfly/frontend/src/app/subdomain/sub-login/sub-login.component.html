<div class="flex justify-center items-center min-h-screen bg-[#212121]">
  <div class="w-full max-w-sm p-8 bg-[#303030] rounded-lg shadow-lg">
    <h2 class="text-2xl font-semibold text-center text-white mb-6">Login</h2>

    <form (ngSubmit)="onLogin()">
      <div class="mb-4">
        <label for="username" class="block text-sm font-medium text-white">Username</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="username"
          name="username"
          class="focus w-full p-3 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <!-- required -->
      </div>

      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-white">Password</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          class="w-full p-3 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <!-- required -->
      </div>

      <button
        type="submit"
        class="w-full p-3 bg-blue-500 text-white font-semibold rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400"
      >
        Login
      </button>
    </form>

    <div *ngIf="loginMessage" [ngClass]="{ 'text-green-500': isSuccess, 'text-red-500': !isSuccess }" class="mt-4 text-center">
      {{ loginMessage }}
    </div>
  </div>
</div>
