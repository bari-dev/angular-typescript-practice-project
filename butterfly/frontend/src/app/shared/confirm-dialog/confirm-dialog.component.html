<div class="rounded-[50px] p-10">
  <h1 mat-dialog-title class="text-white font-bold">Confirm Deletion</h1>
  <div mat-dialog-content class="text-white">
    <p>{{ data.message }}</p>
  </div>
  <div mat-dialog-actions class="flex justify-between align-center items-center">
    <button mat-button (click)="onCancel()">{{ data.cancelButtonText }}</button>
    <button mat-button color="warn" (click)="onConfirm()">
      {{ data.confirmButtonText }}
    </button>
  </div>
</div>
