<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
  
  <mat-card appearance="outlined">
    <div class="bg-white shadow rounded p-4 card--style">
      <div class="flex items-start">
        <i class="icofont icofont-pie-chart text-blue-500 bg-blue-100 rounded-full p-2 text-xl mt-[6px]"></i>
        <div class="ml-4">
          <span class="text-blue-500 font-semibold text-1xl">Use Space</span>
          <h4 class="text-lg font-bold">49/50GB</h4>
          <div class="mt-2 text-gray-500 text-sm flex items-center">
            <i class="icofont icofont-warning text-blue-500 mr-2"></i>Get more space
          </div>
        </div>
      </div>
    </div>
  </mat-card>

  
  <div class="bg-white shadow rounded p-4 card--style">
    <div class="flex items-start">
      <i class="icofont icofont-ui-home text-pink-500 bg-pink-100 rounded-full p-2 text-xl mt-[6px]"></i>
      <div class="ml-4">
        <span class="text-pink-500 font-semibold text-1xl">Revenue</span>
        <h4 class="text-xl font-bold">$23,589</h4>
        <div class="mt-2 text-gray-500 text-sm flex items-center">
          <i class="icofont icofont-calendar text-pink-500 mr-2"></i>Last 24 hours
        </div>
      </div>
    </div>
  </div>
  

  
  <div class="bg-white shadow rounded p-4 card--style">
    <div class="flex items-start">
      <i class="icofont icofont-warning-alt text-green-500 bg-green-100 rounded-full p-2 text-xl mt-[6px]"></i>
      <div class="ml-4">
        <span class="text-green-500 font-semibold text-1xl">Fixed issue</span>
        <h4 class="text-xl font-bold">45</h4>
        <div class="mt-2 text-gray-500 text-sm flex items-center">
          <i class="icofont icofont-tag text-green-500 mr-2"></i>Tracked from Microsoft
        </div>
      </div>
    </div>
  </div>
  

  
  <div class="bg-white shadow rounded p-4 card--style">
    <div class="flex items-start">
      <i class="icofont icofont-social-twitter text-yellow-500 bg-yellow-100 rounded-full p-2 text-xl mt-[6px]"></i>
      <div class="ml-4">
        <span class="text-yellow-500 font-semibold text-1xl">Followers</span>
        <h4 class="text-xl font-bold">+562</h4>
        <div class="mt-2 text-gray-500 text-sm flex items-center">
          <i class="icofont icofont-refresh text-yellow-500 mr-2"></i>Just updated
        </div>
      </div>
    </div>
  </div>
  
</div>
