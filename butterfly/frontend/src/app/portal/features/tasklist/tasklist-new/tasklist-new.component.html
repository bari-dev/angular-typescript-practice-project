<div class="max-w-lg mx-auto p-6 bg-[#212121] rounded-lg shadow-md">
  <!-- Back Button -->
  <div class="flex justify-between items-center mb-6">
    <button
      (click)="goBack()"
      class="text-white bg-gray-600 hover:bg-gray-500 px-4 py-2 rounded-md font-semibold focus:outline-none"
    >
      Back
    </button>
  </div>

  <h2 class="text-2xl font-semibold text-center mb-6 text-white">Create New TaskList</h2>

  <!-- Form -->
  <form (ngSubmit)="onSubmit()" #tasklistForm="ngForm">
    <div class="mb-4">
      <label for="tasklistName" class="block text-sm font-medium text-white mb-2">TaskList Name</label>
      <input
        type="text"
        id="tasklistName"
        name="tasklistName"
        [(ngModel)]="tasklistName"
        #tasklistNameInput="ngModel"
        required
        class="w-full p-3 border border-gray-300 rounded-md text-black focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Enter the Tasklist Name"
      />
      <!-- Validation Message -->
      <div *ngIf="tasklistNameInput.invalid && tasklistNameInput.touched" class="text-sm text-red-600 mt-2">
        TaskList Name is required.
      </div>
    </div>

    <!-- Error Message from API or form validation -->
    <div *ngIf="errorMessage" class="text-sm text-red-600 mt-4">
      {{ errorMessage }}
    </div>

    <div class="flex justify-center">
      <button
        type="submit"
        [disabled]="tasklistForm.invalid"
        class="w-full bg-blue-500 text-white font-semibold py-3 px-4 rounded-md hover:bg-blue-600 focus:outline-none disabled:bg-gray-400"
      >
        Create TaskList
      </button>
    </div>
  </form>
</div>
