<div class="p-5">
  <div class="flex justify-between items-center mb-5">
    <h1 class="text-left text-3xl font-bold">TaskLists</h1>

    <div class="flex justify-between items-center mb-5">
      <button mat-raised-button class='btn btn-primary' routerLink="/tasklists/new">Create New Tasklist</button>
    </div>
  </div>

  <span *ngIf="tasklists.length > 0">
    <table mat-table [dataSource]="tasklists" class="mat-elevation-z8">
      <ng-container matColumnDef="tasklistNumber">
        <th mat-header-cell *matHeaderCellDef> Sn# </th>
        <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
      </ng-container>
    
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Title </th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>
    
      <ng-container matColumnDef="creator">
        <th mat-header-cell *matHeaderCellDef> Creator </th>
        <td mat-cell *matCellDef="let element">{{ element.creator.firstName + ' ' + element.creator.lastName }}</td>
      </ng-container>
    
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef> Created At </th>
        <td mat-cell *matCellDef="let element">
          {{ element.createdAt | date:'MM-dd-yyyy hh:mm a':'UTC'}}
        </td>
      </ng-container>
        
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button [routerLink]="['/tasklists/edit', element.id]" *ngIf="currentUserId == element.creator.id">
            <mat-icon>edit</mat-icon>
          </button>
          <!-- 
          <button mat-icon-button (click)="deleteTasklist(element.id)">
            <mat-icon>delete</mat-icon>
          </button> -->
          <button mat-icon-button (click)="openTaskListPage(element)">
            <mat-icon>open_in_new</mat-icon>
          </button>
        </td>
      </ng-container>
    
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [length]="tasklists.length" [pageSize]="5" [pageSizeOptions]="[5]" aria-label="Select page"></mat-paginator>
  </span>

  <div class="font-bold pt-8 border flex justify-center items-center align-center p-5 rounded-[10px]" *ngIf="tasklists.length === 0">
    <p>No TaskLists found</p>
  </div>
</div>
